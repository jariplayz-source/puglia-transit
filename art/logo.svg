<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11706a"/><stop offset="1" stop-color="#0c2b3b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- the route: out on the left, round the top, back on the right: it draws a pin -->
  <path d="M256 404 L169 280 A108 108 0 1 1 343 280 Z" fill="none" stroke="#f6f1e7" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- direction: a chevron on top of the loop -->
  <path d="M238 92 L262 112 L238 132" fill="none" stroke="#ffb547" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- home / start at the tip -->
  <circle cx="256" cy="404" r="34" fill="#ffb547" stroke="#0e3a44" stroke-width="10"/>
  <!-- the destination dot inside the pin -->
  <circle cx="256" cy="206" r="34" fill="#f6f1e7"/>
</svg>
